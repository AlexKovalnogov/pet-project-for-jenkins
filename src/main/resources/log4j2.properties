# Set the root logger level to INFO and its appender to Console
status = error
name = PropertiesConfig

# Console Appender configuration
appender.console.type = Console
appender.console.name = Console
appender.console.Target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = "%d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %logger{36} - %msg%n"

# Logger configuration for custom packages/classes
logger.myLogger.name = com.example
logger.myLogger.level = debug
logger.myLogger.appenderRef.console.ref = Console

# Root logger configuration
rootLogger.level = info
rootLogger.appenderRef.console.ref = Console